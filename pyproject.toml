[project]
name = "pricetracker"
version = "0.1.0"
description = "Track and compare Spanish supermarket food prices (flyers + online shops), normalized to EUR/kg, EUR/L or EUR/unit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pillow>=10.4",
]

[project.scripts]
pricetracker = "pricetracker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
